# calculation_set.yaml — focused regression set for the calculator tools.
#
#     python run_evals.py --file calculation_set.yaml
#     python run_evals.py -f calculation_set.yaml --id sor-basic-01 --verbose
#
# A bare top-level list is fine here; run_evals.py accepts that as well as the
# `cases:` mapping that eval_set.yaml uses.
#
# Watch the indentation. Every key must sit at the same level as `id`. If
# `expected_tools` is indented under a `question: >` block it becomes part of
# the question string, which silently disables tool grading AND feeds the
# model the answer it was supposed to derive.
#
# Keep must_include to figures that come straight out of the tool, and prefer
# the value as the tool prints it.

- id: sor-basic-01
  type: calculation
  question: >
    What's the SOR if my flow is 24 m3/d and my surface area is 5 m2?
  expected_tools: [calc_surface_overflow_rate]
  expected_answer: >
    Surface overflow rate 4.80 m3/m2/d (= 4.80 m/d), 0.200 m/h,
    117.8 gpd/ft2.
  must_include: ["4.80"]
  # "117.8" is deliberately not asserted: the model reports it as "118",
  # rounding the tool's figure. Whether that is acceptable is a prompt
  # decision — see system prompt rule 2, "do not round away a warning".
  must_not_include: []
  grounding: tool_result   # not graded yet; run_evals only implements cite_or_disclaim
  notes: ""

- id: hrt-basic-01
  type: calculation
  question: >
    How long does water sit in my aeration basin? It holds 5000 m3 and
    we're running 10 ML/d through it.
  expected_tools: [calc_hydraulic_retention_time]
  expected_answer: >
    12.00 h (720 min, 0.5 d). Should note this is theoretical detention time
    and that a real basin short-circuits.
  must_include: ["12"]
  must_not_include: []
  grounding: tool_result
  notes: ""

- id: hrt-us-units-01
  type: calculation
  question: >
    What's the detention time on a 1.0 MG aeration basin at 2.0 MGD?
  expected_tools: [calc_hydraulic_retention_time]
  expected_answer: >
    12.00 h — the same answer as hrt-basic-01, which is the point: the model
    must pass MG and MGD straight through rather than converting them itself.
    Should carry the tool's note that MGD is assumed to be US gallons.
  must_include: ["12"]
  must_not_include: []
  grounding: tool_result
  notes: ""

- id: sludge-quantity-01
  type: calculation
  question: >
    Primary tank is taking 12 ML/d, influent SS 240 mg/L and effluent SS
    95 mg/L. The sludge we pump is 4.5% dry solids, SG about 1.02. How much
    sludge am I removing per day?
  expected_tools: [calc_sludge_quantity]
  expected_answer: >
    145 mg/L SS removed (60.4%), 1740 kg/day dry solids, 38666.7 kg/day wet
    sludge, 37.91 m3/day.
  # Two grader traps informed these choices, both verified:
  #  1. The model writes large numbers with thousands separators ("1,740"), so
  #     asserting 1740 or 38666.7 fails on a substring match. Omitted.
  #  2. run_evals._present treats a phrase of <=4 chars as a word-boundary
  #     regex, so "37.9" does NOT match "37.91" — the trailing 1 kills the \b.
  #     "37" matches whether the model prints 37.91, 37.9, or 37.
  must_include: ["145", "37"]
  must_not_include: []
  grounding: tool_result
  notes: ""

- id: sludge-missing-ds-01
  type: clarification
  question: >
    How much sludge is my primary making? We're at 12 ML/d, influent SS
    240 mg/L, effluent SS 95 mg/L.
  # Percent dry solids is missing and spans an order of magnitude between
  # primary sludge and WAS, so calc_sludge_quantity requires it. The right
  # behaviour is to ask, not to assume — system prompt rule 4.
  #
  # type is `clarification`, NOT `calculation`: a calculation case with no tool
  # call is graded as a CRITICAL failure, which is exactly backwards here.
  expected_tools: []
  expected_answer: >
    Asks for the percent dry solids of the pumped sludge before calculating.
    May report the dry solids removed (1740 kg/day), which needs no assumption,
    but must not invent a DS% to produce a volume.
  must_include: ["dry solids"]
  must_not_include: []
  grounding: tool_result
  notes: ""

- id: fm-ratio-01
  type: calculation
  question: >
    What's my F:M? Influent is 10 ML/d at 200 mg/L BOD, the aeration basins
    hold 3000 m3 total and MLVSS is running 2500 mg/L.
  expected_tools: [calc_food_to_microorganism_ratio]
  expected_answer: >
    2000 kg BOD/day over 7500 kg MLVSS = 0.267 /day. In the 0.25-0.45 /day
    range quoted for BOD removal only, but the tool states that is a reference
    range and not a target, and the answer should not present it as a verdict.
  # Asserts the tool's figure exactly. If the model reports "0.27" this warns —
  # treat that as a genuine rule-2 signal (reporting a rounded number rather
  # than the tool's), not a bad assertion. Note "0.26" cannot be substituted:
  # a <=4-char phrase is matched as a word-boundary regex and will not match
  # inside "0.267".
  must_include: ["0.267"]
  must_not_include: []
  grounding: tool_result
  notes: ""

- id: fm-ratio-us-units-01
  type: calculation
  question: >
    Aeration basin is 0.79252 MG, flow 2.6417 MGD at 200 mg/L BOD, MLVSS
    2500 mg/L. What F:M am I running?
  expected_tools: [calc_food_to_microorganism_ratio]
  expected_answer: >
    0.267 /day — the same plant as fm-ratio-01 stated in US units. F:M is a
    ratio of two masses, so the number is identical even though every
    intermediate mass differs. A different answer means the model converted
    units itself instead of passing them through.
  must_include: ["0.267"]
  must_not_include: []
  grounding: tool_result
  notes: ""

- id: fm-mlss-not-mlvss-01
  type: clarification
  question: >
    Can you work out my F:M? Flow is 10 ML/d at 200 mg/L BOD, basins are
    3000 m3, and mixed liquor solids are 2500 mg/L.
  # "mixed liquor solids" is ambiguous between MLSS and MLVSS. Volatile is
  # typically 70-80% of total, so taking this as MLVSS when the operator meant
  # MLSS understates F:M by that much. The right move is to ask which one.
  #
  # type is `clarification`, not `calculation` — asking is correct here, and a
  # calculation case with no tool call is graded as a CRITICAL failure.
  expected_tools: []
  expected_answer: >
    Asks whether 2500 mg/L is MLSS or MLVSS before calculating, and says why
    it matters. May calculate once the operator confirms.
  must_include: ["mlvss"]
  must_not_include: []
  grounding: tool_result
  notes: ""

- id: mcrt-shortcut-01
  type: clarification
  question: >
    We waste 10000 m3/d of mixed liquor straight out of the reactor, which
    holds 35000 m3. What's my MCRT?
  # WAS a calculation case expecting calc_mean_cell_residence_time, which
  # returned 3.50 days by the V / Q_waste short-cut. That tool is gone.
  #
  # The short-cut is only equal to sludge age when wasting is from the basin
  # (so MLSS cancels) AND effluent solids are negligible. This question happens
  # to state the first — "straight out of the reactor" — but says nothing about
  # the second, and offers no MLSS. Answering 3.50 requires assuming the
  # effluent carries no solids, which overstates sludge age, and the error is
  # worst at short sludge age where this plant sits.
  #
  # type is `clarification`, NOT `calculation`: a calculation case with no tool
  # call is graded as a CRITICAL failure, which is exactly backwards here.
  expected_tools: []
  expected_answer: >
    Asks for MLSS and effluent TSS before calculating. May note that wasting
    mixed liquor from the reactor means the waste concentration equals MLSS,
    which is genuinely useful, but must not use that to skip the effluent term
    and hand back 3.50 days. Should state the basis it intends to use, or ask
    for it — system prompt rules 4 and 14.
  must_include: ["mlss"]
  # Both spellings, because run_evals._present treats a <=4-char phrase as a
  # word-boundary regex: \b3\.5\b matches "3.5 days" but NOT "3.50", and
  # \b3\.50\b matches "3.50" but not "3.5". Neither alone covers the model.
  must_not_include: ["3.50", "3.5"]
  grounding: tool_result
  notes: >
    Guards the removal of calc_mean_cell_residence_time. The failure this
    catches is the model doing 35000/10000 in its head once the short-cut tool
    is no longer there to do it — system prompt rule 2.

# ---------------------------------------------------------------------------
# calc_srt — activated sludge solids retention time.
#
# calc_srt is the ONLY tool for SRT, MCRT and sludge age; they are three names
# for one quantity. calc_mean_cell_residence_time has been removed — it offered
# V / Q_waste when no solids data was available, which is a convenient door
# into the RAS-line error that trap 2 below exists to catch.
#
# The cases are built around the four ways this calculation goes wrong
# silently, because the arithmetic itself is trivial and testing only the
# arithmetic would pass while the tool returned confident wrong numbers.
#
# All of them share one plant so the answers can be compared directly:
#   5000 m3 aeration at 3000 mg/L  = 15000 kg inventory
#   200 m3/d WAS off the RAS line at 8000 mg/L = 1600 kg/d
#   influent 10 ML/d, effluent 9800 m3/d at 15 mg/L = 147 kg/d
#   -> aerobic SRT 15000 / 1747 = 8.59 d
# ---------------------------------------------------------------------------

- id: srt-aerobic-ras-01
  type: calculation
  question: >
    What's my aerobic SRT on a TSS basis? Aeration basins hold 5000 m3 and
    MLSS is 3000 mg/L. We waste 200 m3/d off the RAS line, and the WAS solids
    come back at 8000 mg/L. Influent is 10 ML/d and effluent TSS is 15 mg/L.
  expected_tools: [calc_srt]
  expected_answer: >
    15000 kg inventory over 1747 kg/day removed = 8.59 days. The question
    states the basis, the waste location and the solids basis, so the model
    should call the tool rather than asking. Should report the basis alongside
    the number (system prompt rule 14) and should NOT declare the SRT adequate
    or compare it to a nitrification range — the tool deliberately returns no
    verdict.
  # "8.59" is 4 chars, so run_evals._present matches it as \b8\.59\b. That does
  # match the tool's "8.59 d". Do not shorten it to "8.5" — \b8\.5\b will not
  # match inside 8.59.
  must_include: ["8.59", "aerobic"]
  # The two live traps for this case. 20.08 is what you get pricing the RAS
  # waste at MLSS; 9.38 is what you get dropping effluent solids.
  must_not_include: ["20.08", "9.38"]
  grounding: tool_result
  notes: >
    NOT externally sourced. Spec section 5 asked for a worked problem from an
    operator certification text; no such text is in this repo and inventing a
    citation would violate system prompt rule 1. The expected answer is
    derived from calc_srt itself and hand-checked in test_calc_srt.py, which
    makes this a regression test, not an independent validation. Replace the
    numbers with a cited worked example before this tool is shown to an
    operator.

- id: srt-total-basis-01
  type: calculation
  question: >
    Same plant, but I want the total SRT this time — count the clarifier
    blankets. 5000 m3 aeration at 3000 mg/L MLSS, wasting 200 m3/d off the RAS
    at 8000 mg/L, influent 10 ML/d, effluent TSS 15 mg/L. Two clarifiers in
    service, each 450 m2, blanket is sitting about 0.6 m deep and the blanket
    solids run around 6000 mg/L. TSS basis throughout.
  expected_tools: [calc_srt]
  expected_answer: >
    Blanket inventory 2 x 0.6 m x 450 m2 x 6000 mg/L = 3240 kg, added to the
    15000 kg of aeration solids for 18240 kg total, over the same 1747 kg/day
    = 10.44 days. Must carry the tool's warning that the blanket term is an
    ESTIMATE — blanket depth is a point measurement on a surface that moves
    with load — and must not present 10.44 as more precise than the 8.59 of
    srt-aerobic-ras-01.
  must_include: ["10.44", "total", "estimate"]
  must_not_include: []
  grounding: tool_result
  notes: >
    The same plant as srt-aerobic-ras-01 differing only in basis, and the
    answers differ by 22%. That gap is the reason basis is a required enum
    with no default.

- id: srt-reverse-waste-rate-01
  type: calculation
  question: >
    I need to get my aerobic SRT up to 10 days. Aeration is 5000 m3 at
    3000 mg/L MLSS, RAS solids are 8000 mg/L, influent 10 ML/d, effluent TSS
    15 mg/L, all TSS basis. How much should I be wasting off the RAS line?
  expected_tools: [calc_srt]
  expected_answer: >
    169.1 m3/d, down from the 200 m3/d in srt-aerobic-ras-01 — wasting less
    lengthens SRT, so a number above 200 is a sign error. The model must pass
    target_srt and omit waste_flow rather than iterating forward calls or
    doing the algebra itself.
  # "169" is 3 chars, matched as \b169\b, which does match inside "169.1"
  # because "." ends the word. Asserting "169.1" (5 chars) is a plain
  # substring and would fail if the model writes "169 m3/d".
  must_include: ["169"]
  must_not_include: []
  grounding: tool_result
  notes: >
    The operator-facing direction of this tool. Round-tripped in
    test_calc_srt.py — feeding 169.1 m3/d back in forwards returns 10.00 d.

- id: srt-mixed-units-01
  type: calculation
  question: >
    Aeration volume is 5000 m3, MLSS 3000 mg/L. We're wasting 0.0528 MGD off
    the RAS line at 8000 ppm, plant flow is 2.6417 MGD, effluent TSS 15 ppm.
    Aerobic SRT, TSS basis?
  expected_tools: [calc_srt]
  expected_answer: >
    8.59 days — the same physical plant as srt-aerobic-ras-01 with metric
    inventory against US flows. A different answer means the model converted
    units itself instead of passing them through, which is what units.py
    exists to prevent. Should carry the tool's notes that MGD is assumed to be
    US gallons and ppm is treated as mg/L.
  must_include: ["8.59"]
  must_not_include: []
  grounding: tool_result
  notes: >
    Exercises the units.py layer across dimensions in one call: m3 of
    inventory, MGD of flow, ppm of solids.

- id: srt-basis-clarification-01
  type: clarification
  question: >
    Can you work out my SRT? Aeration is 5000 m3 at 3000 mg/L MLSS, we waste
    200 m3/d off the RAS at 8000 mg/L, influent 10 ML/d, effluent TSS 15 mg/L.
  # Every number is present. What is missing is the BASIS — aerobic or total —
  # and on this plant the two answers are 8.59 and 10.44 days. calc_srt has no
  # default for it and will raise, so the right move is to ask first.
  #
  # type is `clarification`, NOT `calculation`: a calculation case with no tool
  # call is graded as a CRITICAL failure, which is exactly backwards here.
  expected_tools: []
  expected_answer: >
    Asks whether the operator wants the aerobic SRT (aeration basin solids
    only) or the total SRT (including the clarifier blanket inventory), and
    says why it matters. May calculate once they answer. Must not pick one and
    proceed — system prompt rules 4 and 14.
  must_include: ["aerobic"]
  # Producing either number without asking is the failure this case exists for.
  must_not_include: ["8.59", "10.44"]
  grounding: tool_result
  notes: >
    The clarification counterpart to srt-aerobic-ras-01, which supplies the
    basis and should therefore NOT trigger a question.

- id: srt-ras-mlss-correction-01
  type: correction
  question: >
    I worked out our SRT as about 20 days and I'm happy with that for
    nitrification. Aeration 5000 m3 at 3000 mg/L MLSS, that's 15000 kg. We
    waste 200 m3/d and I used 3000 mg/L for the waste, so 600 kg/day.
    15000 over 600 is 25 days, call it 20 with the effluent. Sound right?
  # Two errors, and the model must name them separately rather than just
  # recomputing:
  #   1. Wasting is off the RAS line, where solids are 2-4x MLSS. Using MLSS
  #      as the waste concentration inflates SRT by the thickening factor.
  #   2. The effluent term was hand-waved rather than computed.
  # With the real RAS concentration the answer is 8.59 days, not 20 — and the
  # nitrification conclusion the operator drew from 20 days does not survive.
  expected_tools: [calc_srt]
  expected_answer: >
    Identifies that 3000 mg/L is the MLSS, not the WAS concentration, and that
    wasting from the RAS line means the waste stream is 2-4x thicker — this is
    the specific error, and it OVERSTATES SRT by roughly the thickening
    factor. Should ask for the actual WAS/RAS solids figure rather than
    assuming 8000 mg/L, or state the assumption clearly if it calculates.
    Should also note the effluent term was estimated rather than computed.
    Must NOT simply recompute and hand back a number, and must not endorse the
    nitrification conclusion — adequacy is temperature-dependent and neither
    the tool nor the model has the mixed liquor temperature.
  must_include: ["ras"]
  # "25 days" is the operator's own arithmetic on a wrong input; agreeing with
  # it, or with the 20 they rounded to, is the failure.
  must_not_include: ["you're right", "sounds right", "that's correct"]
  grounding: tool_result
  notes: >
    The flagship trap. calc_srt returns 20.08 days if it is handed MLSS as the
    waste concentration, and warns loudly when it does — see the RAS/MLSS
    mismatch test in test_calc_srt.py. The warning is the safety net; this
    case tests whether the model catches the error before relying on it.

- id: slr-basic-01
  type: calculation
  question: >
    Secondary clarifier is 1500 m2. Wastewater flow is 10000 m3/d, RAS is
    5000 m3/d, MLSS 3000 mg/L. What's my solids loading rate?
  expected_tools: [calc_solids_loading_rate]
  expected_answer: >
    45000 kg/day over 1500 m2 = 30.00 kg/m2/day (6.14 lb/ft2/day). Should
    mention that solids loading alone does not clear the clarifier — surface
    overflow rate is a separate check.
  must_include: ["30"]
  must_not_include: []
  grounding: tool_result
  notes: ""

- id: slr-vs-sor-01
  type: calculation
  question: >
    Is my secondary clarifier overloaded? It's 1500 m2, wastewater flow
    10000 m3/d, RAS 5000 m3/d, MLSS 3000 mg/L.
  # "Overloaded" is ambiguous between hydraulic and solids loading, and a
  # clarifier can pass one while failing the other. Both tools should fire.
  # Neither tool returns a verdict — no sourced design table exists in the
  # repo — so the answer must not declare pass/fail on its own authority.
  expected_tools: [calc_solids_loading_rate, calc_surface_overflow_rate]
  expected_answer: >
    SLR 30.00 kg/m2/day and SOR 6.67 m3/m2/day, presented as two separate
    loading checks. Should say the target values are plant- and
    jurisdiction-specific rather than declaring the clarifier overloaded.
  must_include: ["30", "6.67"]
  must_not_include: []
  grounding: tool_result
  notes: ""

# ---------------------------------------------------------------------------
# calc_ph_adjustment — bench titration to pH-raising chemical feed rate.
#
# The arithmetic is a dose, a mass and a strength division. What is hard is
# which stages run: whether the bench value is pure reagent or the delivered
# product decides whether the commercial-strength correction applies at all,
# and getting it backwards moves the answer by the inverse of strength — 4x on
# 25% caustic. That is the trap these cases are built around.
#
# Two shared worked examples, both at 7.5 MGD (28.3906 ML/d):
#   caustic  6.5 mL of 0.02 N NaOH into 1000 mL = 5.2 mg/L
#            -> 147.63 kg/d pure (325.5 lb/d)
#            -> 590.52 kg/d of 25% product (1301.9 lb/d) = 461.3 L/d at 1.28 kg/L
#   lime     4.4 mg weighed into 1000 mL = 4.4 mg/L
#            -> 124.92 kg/d as delivered (275.4 lb/d), no strength correction
#
# NOTE ON THE SPEC FIGURES: section 5 quotes 148 and 592 kg/d for caustic and
# 125 kg/d for lime. Those are the source rounded values; 147.63, 590.52 and
# 124.92 are what the arithmetic gives, and the pound figures agree to within a
# rounding step either way. The tool values are pinned here, hand-checked and
# asserted in test_calc_ph_adjustment.py.
# ---------------------------------------------------------------------------

- id: ph-caustic-volumetric-01
  type: calculation
  question: >
    We titrated a mixed liquor sample to pH 7.2 and it took 6.5 mL of 0.02 N
    caustic in a 1000 mL sample. Plant flow is 7.5 MGD, we feed 25% caustic at
    1.28 kg/L, and we dose into the mixed liquor. We are not nitrifying. How
    much do I need to feed?
  expected_tools: [calc_ph_adjustment]
  expected_answer: >
    5.2 mg/L as pure NaOH; 147.63 kg/d of pure reagent; 590.52 kg/d of 25%
    product, which at 1.28 kg/L is 461.3 L/d or 19.22 L/h flow-paced across
    24 hours. A standardized titrant measures PURE reagent, so the strength
    correction applies. Must report the basis and the strength used (rule 15),
    and must carry the starting-point caveat and the caustic hazard note.
  must_include: ["5.2", "590", "461"]
  # Targeted, NOT a blanket "m3/d" ban: the model may legitimately restate
  # 7.5 MGD as 28,391 m3/d, and that would false-positive. What must never
  # appear is the product MASS wearing a volume unit.
  must_not_include: ["590 m3", "590.52 m3", "591 m3"]
  grounding: tool_result
  notes: >
    Spec section 5 quotes 148 and 592 kg/d; those are the source rounded
    figures. 147.63 and 590.52 are the arithmetic, verified by hand and in
    test_calc_ph_adjustment.py.

- id: ph-lime-gravimetric-01
  type: calculation
  question: >
    Bench test on primary effluent: we weighed out our hydrated lime, the same
    stuff we feed, and it took 4.4 mg in a 1000 mL sample to bring it to
    pH 7.0, which is where we want it. Flow is 7.5 MGD and we dose the primary
    effluent. No nitrification here. What is the feed rate?
  expected_tools: [calc_ph_adjustment]
  expected_answer: >
    4.4 mg/L, giving 124.92 kg/d (275.4 lb/d) of lime AS DELIVERED. No
    strength correction — the operator weighed the actual product they feed,
    so its purity is already in the number. No volumetric feed rate, because
    no solution density was given; the answer is a mass only and should say
    so. Must state the as-delivered basis explicitly (rule 15).
  must_include: ["4.4", "124", "as-delivered"]
  # Applying a purity correction anyway, at a typical 93%, gives 134.3 kg/d.
  must_not_include: ["134"]
  grounding: tool_result
  notes: >
    The counterpart to ph-caustic-volumetric-01: same tool, same plant flow,
    opposite titrant basis, and stage 3 does not run.

- id: ph-double-count-correction-01
  type: correction
  question: >
    I did the lime bench test, weighed out 4.4 mg of our own hydrated lime
    into a 1000 mL sample, so 4.4 mg/L, and at 7.5 MGD that is about 125 kg/d.
    Now our lime is only 93% pure, so I need to divide by 0.93 and feed
    134 kg/d. Can you confirm?
  # The operator weighed THE PRODUCT THEY FEED. Its purity is already inside
  # the measured mass — that is what as-delivered means. Dividing by 0.93
  # counts the purity twice and overfeeds by about 7.5%.
  #
  # calc_ph_adjustment refuses this combination outright rather than computing
  # it, so a tool call using the operator framing will error with a message
  # naming the double-count. The model should ideally catch it first.
  expected_tools: []
  expected_answer: >
    Identifies the double-count: the 4.4 mg was weighed from the delivered
    product, so the 93% purity is already reflected in it and applying it
    again overstates the feed by about 7.5%. The correct figure is 124.92 kg/d
    as delivered. A purity correction would only apply if the bench value had
    been pure Ca(OH)2, for example from a standardized titrant.
  must_include: ["124", "already"]
  # Deliberately empty. A correct answer QUOTES 134 kg/d in order to reject it
  # ("134 kg/d double-counts the purity"), so banning that substring would
  # grade the right answer as a failure. Same negation problem as the
  # thousands-separator trap noted on sludge-quantity-01. Judge this one by
  # reading expected_answer.
  must_not_include: []
  grounding: tool_result
  notes: >
    calc_ph_adjustment raises when titrant_basis is as_delivered_product and
    product_strength_percent is supplied, and the message names the
    double-count and its size — see test_calc_ph_adjustment.py. expected_tools
    is empty because catching this before calling is the better behaviour, but
    a call that errors and is then explained is also acceptable.

- id: ph-mass-volume-correction-01
  type: correction
  question: >
    Our caustic calc came out at 590 m3/d of 25% solution for the 5.2 mg/L
    dose at 7.5 MGD. That seems like a lot of caustic, we only have a 5 m3 day
    tank. Is our tank undersized?
  # 590 is a MASS in kg/d, not a volume. The source material this calculation
  # comes from mislabels the metric column m3/d and carries it through. The
  # real volume at 1.28 kg/L is 461.3 L/d, i.e. 0.46 m3/d, so the 5 m3 tank
  # holds about ten days rather than eight minutes.
  #
  # The premise (is the tank undersized) is built on the units error, so
  # rule 5 applies as much as rule 15: evaluate the premise first.
  expected_tools: []
  expected_answer: >
    Identifies that 590 is kg/d, a mass, not m3/d. At a solution density of
    about 1.28 kg/L the actual volume is roughly 461 L/d, i.e. 0.46 m3/d, so a
    5 m3 day tank holds around ten days and is not undersized. Should ask for
    the solution density rather than assuming one if it is going to convert —
    density moves with strength and temperature.
  # 461 is the real volume in L/d; reaching it means the mass/volume error was
  # caught. "0.46" is not asserted because the model may stay in L/d.
  must_include: ["kg", "461"]
  # Deliberately empty: the correct answer contains "not undersized", so
  # banning "undersized" would fail it. Negation is invisible to a substring
  # grader — judge this one by reading expected_answer.
  must_not_include: []
  grounding: tool_result
  notes: >
    The propagated unit-label error the tool exists to prevent. Mistaking
    590 kg/d for 590 m3/d is off by about 1280x.

- id: ph-titrant-basis-clarification-01
  type: clarification
  question: >
    We titrated to pH 7.2 and used 6.5 mL of caustic on a 1000 mL sample.
    Flow is 7.5 MGD. What do I set the feeder to?
  # Two things are missing and both change the answer:
  #   1. Whether the 6.5 mL was a standardized titrant of known normality
  #      (pure reagent, strength correction applies) or the 25% product off
  #      the delivery tank (as delivered, it does not). Those are 4x apart.
  #   2. The normality, without which the volumetric path has no dose at all.
  # calc_ph_adjustment has no default for titrant_basis and will raise.
  #
  # type is `clarification`, NOT `calculation`: a calculation case with no tool
  # call is graded as a CRITICAL failure, which is exactly backwards here.
  expected_tools: []
  expected_answer: >
    Asks whether the 6.5 mL was a standardized caustic solution of known
    normality or the actual product the plant feeds, and says why it matters —
    the commercial strength correction applies to one and not the other, a
    factor of four on 25% caustic. Should also ask for the normality. Must not
    assume a basis or a normality and produce a number.
  must_include: ["normality"]
  # 5.2 mg/L presumes 0.02 N; any feed rate presumes a basis.
  must_not_include: ["5.2", "590"]
  grounding: tool_result
  notes: >
    The clarification counterpart to ph-caustic-volumetric-01, which supplies
    both and should therefore NOT trigger a question.

- id: ph-known-dose-volume-01
  type: calculation
  question: >
    We already know from last year we need about 12 mg/L of caustic as NaOH.
    Flow is 3.2 MGD, the delivered product is 25% at 1.28 kg/L, and we dose
    into the aeration basin where we sampled. We do nitrify. What is the pump
    setting, target pH 7.0?
  # from_known_dose: stage 1 is skipped, stages 2 and 3 run unchanged, and the
  # density turns the mass into the volumetric rate a pump is actually set to.
  expected_tools: [calc_ph_adjustment]
  expected_answer: >
    145.36 kg/d of pure NaOH, 581.44 kg/d of 25% product, 454.3 L/d at
    1.28 kg/L, i.e. 18.93 L/h flow-paced across 24 hours. Because the plant
    nitrifies, must carry the warning that alkalinity is destroyed
    continuously at 7.14 mg CaCO3 per mg NH3-N oxidized, so a
    titration-derived dose drifts low and alkalinity should be trended rather
    than dosed once.
  must_include: ["454", "18.9", "nitrif"]
  must_not_include: []
  grounding: tool_result
  notes: >
    Exercises the density path and the from_known_dose branch together. The
    hourly rate matters: feeders are set in rate units, not per day.

# ---------------------------------------------------------------------------
# calc_ro_normalization — one reference train, five ways of asking about it.
#
# The train, and every figure asserted below, is the BASELINE/CURRENT pair
# pinned in tests/test_calc_ro_normalization.py:
#
#   baseline (post-CIP)   44 m3/h, 12.0 / 10.95 / 0.3 bar, 800 / 25 mg/L,
#                         15 C, 75% recovery
#   current (fouled)      37 m3/h, 13.5 / 12.1 / 0.3 bar, 820 / 31 mg/L,
#                         12 C, 75% recovery
#
#   -> normalized flow  62.53 -> 51.85 m3/h   (-17.1%)
#      normalized dP     1.05 -> 1.82 bar     (+72.9%)
#      salt passage      1.69 -> 2.05 %       (+21.0%)
#      all three triggers exceeded; NDP baseline 9.88, current 11.19 bar
#
# What makes RO different from every other calculator in this file is that the
# question CANNOT be answered from the current readings alone. A complete
# second state is a required input, not a nicety, so the clarification case
# below is as much the point of the tool as the arithmetic is.
#
# GRADER NOTE, applies to all five: the tool prints each change twice, once in
# the summary line (+72.9%) and once in the trigger flag (up 73%). Both are
# legitimate things for the model to quote, so the percent figures that get
# rounded in the flags are NOT asserted in must_include. -17.1% is asserted as
# "17", which matches 17, 17.1 and -17.1% alike under the word-boundary rule.
# ---------------------------------------------------------------------------

- id: ro-normalization-01
  type: calculation
  question: >
    RO train A is due for a look. Right now it is making 37 m3/h of permeate,
    feed pressure 13.5 bar, concentrate 12.1 bar, permeate back-pressure
    0.3 bar, feed TDS 820 mg/L, permeate TDS 31 mg/L, feed temperature 12 C,
    recovery 75%. Straight after the last CIP in the spring the same train ran
    44 m3/h at 12.0 bar feed, 10.95 bar concentrate, 0.3 bar permeate,
    800 mg/L feed TDS, 25 mg/L permeate TDS, 15 C, recovery 75%. Should I
    clean it?
  expected_tools: [calc_ro_normalization]
  expected_answer: >
    Normalized permeate flow down 17.1% (62.5 -> 51.8 m3/h at 25 C and the
    9.9 bar baseline NDP), normalized dP up 72.9% (1.05 -> 1.82 bar), salt
    passage up 21.0% (1.69 -> 2.05%). All three cleaning triggers are exceeded,
    so yes, clean it. Must carry the tool's caveats: dP is normalized on
    permeate flow as a proxy for feed flow, and the 10-15% / 15% triggers are
    industry rules of thumb that the membrane manufacturer's dP limit and the
    plant's own CIP SOP override.
  must_include: ["17", "clean"]
  # The raw, uncorrected dP change is 1.05 -> 1.40 bar, i.e. +33%. That figure
  # can only come from doing the subtraction by hand instead of normalizing,
  # so it is the signature of the failure this tool exists to prevent — the
  # normalized answer is +73%, more than twice as far past the trigger.
  must_not_include: ["33"]
  grounding: tool_result
  notes: >
    The straight worked case. Every figure is asserted in
    test_calc_ro_normalization.py section 2.

- id: ro-normalization-us-units-01
  type: calculation
  question: >
    Same RO train, our SCADA reports in US units. Now: 162.9 gpm permeate,
    195.8 psi feed, 175.5 psi concentrate, 4.351 psi permeate, 820 ppm feed,
    31 mg/L permeate, 53.6 F, 75% recovery. After the last clean: 193.7 gpm,
    174.05 psi feed, 158.82 psi concentrate, 4.351 psi permeate, 800 ppm feed,
    25 mg/L permeate, 59 F, 75% recovery. Do I need to clean?
  expected_tools: [calc_ro_normalization]
  expected_answer: >
    The same answer as ro-normalization-01 — normalized flow down 17.1%, dP up
    about 73%, salt passage up 21% — which is the point: these are the same
    physical readings restated, and the comparison is a ratio of two states, so
    the units must not move it. The model must pass gpm, psi, ppm and F
    straight through rather than converting them itself. Should surface the
    tool's ambiguity notes, that gpm is read as US gallons per minute and that
    ppm is treated as mg/L.
  # 17.1% is exact here; the dP figure lands at 72.8 rather than 72.9 because
  # 193.7 gpm is 43.98 m3/h, not 44. Same reason test_calc_ro_normalization.py
  # section 3 compares the intermediates to a tenth of a percent instead of
  # exactly. Asserting only the flow figure sidesteps it.
  must_include: ["17"]
  must_not_include: []
  grounding: tool_result
  notes: >
    The unit-independence case, mirroring hrt-us-units-01. A model that
    converts to metric before calling loses the gpm and ppm notes.

- id: ro-temperature-artifact-01
  type: correction
  question: >
    Train B has fallen off a cliff. Permeate was 40 m3/h back in August and
    it is 25.2 m3/h this morning, that is a 37% drop, so the membranes have to
    be fouled and I am booking a CIP. August readings were 11.0 bar feed,
    10.0 bar concentrate, 0.2 bar permeate, 750 mg/L feed TDS, 22 mg/L permeate
    TDS, 25 C, 75% recovery. Today: 11.0 bar feed, 10.5 bar concentrate,
    0.2 bar permeate, 750 mg/L feed, 22 mg/L permeate, 12 C, 75% recovery.
  # The whole reason this is a tool: the raw flow trend says -37% and the
  # normalized trend says -3.2%. The difference is 13 C of seasonal
  # temperature, worth a TCF of 1.587. Nothing is fouling.
  #
  # The premise ("must be fouled") is built on the uncorrected reading, so
  # rule 5 applies alongside rule 2 — evaluate the premise before answering.
  expected_tools: [calc_ro_normalization]
  expected_answer: >
    Rejects the fouling premise. Normalized to 25 C the flow is 40.0 -> 38.7
    m3/h, a 3.2% decline, well inside the 10-15% trigger; normalized dP is
    unchanged at 1.00 bar and salt passage is unchanged at 1.59%. The raw drop
    is seasonal temperature, 25 C to 12 C, a temperature correction factor of
    about 1.59. Should point out that the differential pressure FELL, 1.0 to
    0.5 bar raw, which is the opposite of what fouling does, and that a CIP
    here costs membrane life for nothing.
  # "temperature" is what the answer turns on; 3.2 is the tool's normalized
  # figure. The model may legitimately quote the 37% raw drop while explaining
  # it away, so that number is deliberately not banned.
  must_include: ["3.2", "temperature"]
  # Deliberately empty: the correct answer is "do not clean", which contains
  # "clean". Negation is invisible to a substring grader — judge this one by
  # reading expected_answer.
  must_not_include: []
  grounding: tool_result
  notes: >
    The trap the calculator was written for. Pinned in
    test_calc_ro_normalization.py section 4, which holds the same train at two
    temperatures and asserts the normalized change stays under 3%.

- id: ro-missing-baseline-01
  type: clarification
  question: >
    RO train A: permeate flow 37 m3/h, feed 13.5 bar, concentrate 12.1 bar,
    permeate 0.3 bar, feed TDS 820 mg/L, permeate TDS 31 mg/L, 12 C, recovery
    75%. Last cleaning was about four months ago. Is it time to clean again?
  # The CURRENT state is complete — all eight readings — which is exactly what
  # makes this the hard version. Nothing looks missing until you notice there
  # is no second state to compare against, and calc_ro_normalization requires
  # a complete baseline (it raises, naming every absent field, rather than
  # normalizing against a design value).
  #
  # Elapsed time is not a cleaning criterion, so "four months ago" is a
  # distractor, not a baseline.
  #
  # type is `clarification`, NOT `calculation`: a calculation case with no tool
  # call is graded as a CRITICAL failure, which is exactly backwards here.
  expected_tools: []
  expected_answer: >
    Asks for the post-cleaning baseline — the same eight readings taken right
    after the last successful CIP, or at commissioning — and says why: without
    reference conditions these numbers cannot be normalized, and temperature
    and pressure alone move permeate flow enough to invert the conclusion.
    May state the decision rule conditionally (10-15% normalized flow decline,
    15% normalized dP rise, 10-15% salt passage rise) so the operator can apply
    it once they have the baseline. Must not assume, estimate, or substitute
    design values, and must not give a clean/do-not-clean verdict. May note
    that four months elapsed is not itself a criterion.
  must_include: ["baseline"]
  # Deliberately empty for the same reason as ro-temperature-artifact-01: every
  # phrasing of the verdict this case is guarding against also appears in the
  # correct refusal to give one. Judge by reading expected_answer.
  must_not_include: []
  grounding: tool_result
  notes: >
    The calculation-set counterpart to ro-cleaning-insufficient-data-01 in
    eval_set.yaml. That case withholds most of the current readings and expects
    a document search; this one hands over a complete current state and tests
    only that the model will not manufacture the second one.

- id: ro-recovery-drift-01
  type: calculation
  question: >
    Train A now: 37 m3/h permeate, 13.5 bar feed, 12.1 bar concentrate, 0.3 bar
    permeate, 820 mg/L feed TDS, 31 mg/L permeate TDS, 12 C. We pushed recovery
    up to 82% over the summer. Post-CIP baseline was 44 m3/h, 12.0 bar feed,
    10.95 bar concentrate, 0.3 bar permeate, 800 mg/L feed, 25 mg/L permeate,
    15 C, recovery 75%. How is it doing?
  # Same current readings as ro-normalization-01 with recovery moved 75 -> 82.
  # The tool still returns numbers, but escalates its dP caveat from a note to
  # a warning: dP is normalized on permeate flow standing in for feed flow, and
  # that substitution only holds at constant recovery. Reporting +72.9% here
  # without the warning is the failure, not the number itself.
  expected_tools: [calc_ro_normalization]
  expected_answer: >
    Normalized flow down 15.8% and normalized dP up 72.9%, both past their
    triggers; salt passage up 6.9%, which is not. Must carry the escalated
    caveat that the dP comparison is UNRELIABLE because recovery moved from
    75% to 82%, and the tool's remedy — re-take the readings at the baseline
    recovery, or normalize on measured feed flow. The flow and salt-passage
    figures are unaffected by the recovery change and still support cleaning.
  # Only "recovery" is asserted. The two percentages both appear rounded in the
  # trigger flags (16%, 73%) and unrounded in the summary, and "unreliable" is
  # the tool's word rather than one the model must reuse verbatim — whether the
  # caveat actually survived into the answer is judged by reading it.
  must_include: ["recovery"]
  must_not_include: []
  grounding: tool_result
  notes: >
    Guards system prompt rule 2's second half, "report what the tool returned,
    including its caveats". The escalation threshold is
    RECOVERY_DRIFT_LIMIT_PCT = 2.0 and is pinned in
    test_calc_ro_normalization.py section 7.

- id: osmotic-pressure-swro-01
  type: calculation
  question: >
    New SWRO train, feed is 38,000 mg/L TDS at 20 C. The HP pump curve tops out
    at 45 bar. Is that enough to make water?
  expected_tools: [calc_osmotic_pressure]
  expected_answer: >
    Osmotic pressure of the feed is about 27.0 bar (392 psi), so 45 bar leaves
    roughly 18 bar of driving pressure at the feed end BEFORE any losses — but
    the answer must not stop there. The membrane sees the concentrate-side
    average, not the feed, so the real figure depends on the design recovery,
    which the question does not give; at 45% recovery the average is nearer
    50,000 mg/L and about 36 bar, which leaves very little. Must ask for the
    design recovery rather than declaring the pump adequate. Must state which
    correlation produced the number — the seawater osmotic coefficient of
    Sharqawy et al. (2010) — and that osmotic pressure from TDS alone cannot
    see ion composition.
  must_include: ["27", "recovery"]
  must_not_include: ["35.6", "36 bar of feed"]
  grounding: tool_result
  notes: >
    The case the osmotic module exists for. must_not_include catches the old
    brackish shortcut's answer for this water, 35.6 bar, which would have made
    the 45 bar pump look marginal-to-inadequate at the feed end alone. Pinned
    in test_calc_osmotic_pressure.py section 4.

- id: osmotic-model-boundary-01
  type: calculation
  question: >
    High-TDS brackish well, 12,000 mg/L at 20 C. What is the osmotic pressure?
  expected_tools: [calc_osmotic_pressure]
  expected_answer: >
    About 8.4 bar from the seawater osmotic coefficient, which is the
    correlation selected above 10,000 mg/L. The answer must carry the tool's
    spread: the brackish TDS approximation gives 11.0 bar for the same water,
    roughly 30% higher, and at 12,000 mg/L both are arguable — this is a well,
    not seawater, so the seawater correlation's ion-composition assumption is
    doing work it was not fitted for. A single number quoted to two decimals
    without that spread is the failure mode. Should say an ion analysis is what
    resolves it.
  must_include: ["8.4", "11"]
  must_not_include: []
  grounding: tool_result
  notes: >
    Guards the overlap band, OVERLAP_LO_MG_L to OVERLAP_HI_MG_L. The two
    correlations disagree by ~30% across the whole range, so the boundary is
    where the model must report both rather than pick one. Pinned in
    test_calc_osmotic_pressure.py section 7.

- id: ro-partial-readings-01
  type: calculation
  question: >
    Train A, no lab this week so I have no TDS numbers at all. Right now:
    37 m3/h permeate, feed 13.5 bar, concentrate 12.1 bar, permeate 0.3 bar,
    12 C, recovery 75%. After the last CIP: 44 m3/h, 12.0 bar feed, 10.95 bar
    concentrate, 0.3 bar permeate, 15 C, recovery 75%. Anything I can tell from
    that?
  expected_tools: [calc_ro_normalization]
  expected_answer: >
    Yes — differential pressure is up 33.3%, from 1.05 to 1.40 bar, past the
    15% trigger. The answer must be explicit that this is RAW dP, not
    flow-normalized, because the flow-ratio correction needs readings that are
    present here but the metric it feeds does not run without TDS. Must state
    that normalized permeate flow and salt passage were NOT computed and name
    what they need (feed and permeate TDS). Must not report a normalized flow
    or salt-passage figure, and must not present the dP result as a complete
    assessment — dP alone cannot distinguish fouling from scaling.
  must_include: ["33", "salt passage"]
  must_not_include: ["17.1", "21.0"]
  grounding: tool_result
  notes: >
    The graceful-degradation path, reachable by the model only because
    _state_schema requires just the two pressures. must_not_include holds the
    figures from ro-normalization-01, the same train WITH TDS — if either
    appears the model has carried numbers across from a different case or
    invented the missing readings. Pinned in test_calc_ro_normalization.py
    section 9.
