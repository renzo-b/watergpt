# RAG retrieval cases — to append to eval_set.yaml.
#
# Field names below follow the shape of the existing set (id, type, question);
# rename to match whatever eval_set.yaml already uses. The one genuinely new
# field is `expects.source` — the document and location the answer must come
# from. That is what makes a retrieval case scorable without a human reading
# every answer: did the right chunk come back, not just a plausible sentence.
#
# Case types reused from the existing set: open_grounded, procedure,
# calculation, diagnostic, clarification, correction.
#
# Corpus: fixed SOP/PFD set + interpreted spreadsheets. Not user uploads.

- id: pdf_phone_number
  type: exact_value
  question: What's the number for SMDHU?
  expects:
    source:
      document: Adverse-Water-Condition-Notification-Contingency-Plan.pdf
      location: page 1
    contains:
      - 705-721-7520 ext. 8811
      - 1-888-225-7851
  notes: >
    returns the phone numbers
- id: pdf_dosage
  type: exact_value
  question: in the case of bad levels of total coliforms, what's the target free chlorine residual?
  expects:
    source:
      document: Adverse-Water-Quality-HPCs-Standard-Operating-Procedure.pdf
      location: page 1
    contains:
      - 0.2
      - 0.1
      - mg/L
  notes: >
    returns the exact dosage listed in the document
- id: pdf_power_outage
  type: exact_value
  question: what is the the backup generator?
  expects:
    # name of backup generator
    source:
      - document: Power-Outage-Procedure-Contingency-Plan.pdf
        location: page 1
    contains:
      - "Waubaushene Booster Station"
  notes: >
    returns the exact name
- id: pdf_flow_meter_malfunction
  type: exact_value
  question: what is the expected raw flow rate?
  expects:
    # raw water flow expected as per SOP
    source:
      - document: Raw-Water-Flow-Meter-Malfunction-or-Failure-Standard-Operating-Procedure.pdf
        location: page 1
    contains:
      - "19.0"
  notes: >
    returns the exact flow
- id: pdf_turbidity
  type: open_ended
  question: what should I do if NTU is over the limit in my pretreatment?
  expects:
    # understand NTU refer to turbidity
    source:
      - document: High-Turbidity-Alert-Procedure-Contingency-Plan.pdf
        location: page 1
    contains:
      - "shut"
      - "down"
      - "filter-to-waste"
  notes: >
    returns the exact flow
- id: excel_CT
  type: exact_value
  question: our raw water is at 28degC - which CT equation do we use?
  expects:
    # 28 > 12.5, so the over-12.5degC branch applies: Equation 3-4, not 3-3.
    # The sheet's own CT numbers (E23/E24) are instance_values computed at its
    # stored 7.5degC input, and are dropped by design. 22.69 would be the wrong
    # answer regardless - the same equation at 28degC gives 5.68.
    source:
      - document: excel_1s_simple.xlsx
        location: "sheet 'CT'"
    contains:
      - "3-4"
  notes: >
    Interpreted-spreadsheet path. Scores branch selection from durable
    statements, not arithmetic on a stored value.
- id: excel_CT2
  type: exact_value
  question: if our CT is higher than required CT, are we okay, yes or no?
  expects:
    #
    source:
      - document: excel_1s_simple.xlsx
        location: "sheet 'CT'"
    contains:
      - "yes"
  notes: >
    Interpreted-spreadsheet path. Scores branch selection from durable
    statements, not arithmetic on a stored value.
